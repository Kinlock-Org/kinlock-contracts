# Publish @kinlock/contract to npm when a `bindings-vX.Y.Z` tag is pushed (ADR-0023, M1-18).
# Refuses to publish if the committed bindings differ from a fresh generation, or if the tag
# doesn't match the committed package version. Needs the repo secret NPM_TOKEN.
name: bindings
on:
  push:
    tags: ["bindings-v*"]
permissions:
  contents: read
  id-token: write # npm provenance
env:
  STELLAR_CLI_VERSION: 27.0.0
  STELLAR_CLI_SHA256: 357bf712f6353c28cd33c794402a3c87231757a5b305e6ef1604365af4fdd556
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
          targets: wasm32v1-none
      - name: Install stellar-cli (pinned, checksum verified)
        run: |
          name="stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSL -o "$name" "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/$name"
          echo "${STELLAR_CLI_SHA256}  $name" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar xzf "$name" -C "$HOME/.local/bin" stellar
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Tag matches the committed package version
        run: |
          tag_version="${GITHUB_REF_NAME#bindings-v}"
          pkg_version="$(jq -r .version bindings/typescript/package.json)"
          [ "$tag_version" = "$pkg_version" ] || { echo "::error::tag $tag_version != package.json $pkg_version"; exit 1; }
      - name: Committed bindings match a fresh generation
        run: |
          scripts/gen-bindings.sh
          git diff --exit-code -- bindings/typescript
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Build and publish
        working-directory: bindings/typescript
        run: |
          npm install
          npm run build
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
