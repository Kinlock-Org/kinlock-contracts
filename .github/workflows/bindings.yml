# Release @kinlock/contract when a `bindings-vX.Y.Z` tag is pushed (ADR-0026, M1-18): the packed
# .tgz is attached to a GitHub Release of that tag. Refuses to release if the committed bindings
# differ from a fresh generation, or if the tag doesn't match the committed package version.
# Uses the workflow's GITHUB_TOKEN; no publish secret.
name: bindings
on:
  push:
    tags: ["bindings-v*"]
permissions:
  contents: write # create the GitHub Release
env:
  STELLAR_CLI_VERSION: 27.0.0
  STELLAR_CLI_SHA256: 357bf712f6353c28cd33c794402a3c87231757a5b305e6ef1604365af4fdd556
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
          targets: wasm32v1-none
      - name: Install stellar-cli (pinned, checksum verified)
        run: |
          name="stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSL -o "$name" "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/$name"
          echo "${STELLAR_CLI_SHA256}  $name" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar xzf "$name" -C "$HOME/.local/bin" stellar
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Tag matches the committed package version
        run: |
          tag_version="${GITHUB_REF_NAME#bindings-v}"
          pkg_version="$(jq -r .version bindings/typescript/package.json)"
          [ "$tag_version" = "$pkg_version" ] || { echo "::error::tag $tag_version != package.json $pkg_version"; exit 1; }
      - name: Committed bindings match a fresh generation
        run: |
          scripts/gen-bindings.sh
          git diff --exit-code -- bindings/typescript
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build and pack
        working-directory: bindings/typescript
        run: |
          npm install
          npm run build
          npm pack
      - name: Attach to a GitHub Release (never re-uploads an existing version)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tgz="bindings/typescript/kinlock-contract-${GITHUB_REF_NAME#bindings-v}.tgz"
          test -f "$tgz"
          gh release create "$GITHUB_REF_NAME" "$tgz" \
            --title "@kinlock/contract ${GITHUB_REF_NAME#bindings-v}" \
            --notes "Install: \`pnpm add https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/$(basename "$tgz")\`"
