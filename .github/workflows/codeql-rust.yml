# Rust CodeQL analysis. GitHub's default code-scanning setup (enabled separately for
# the "actions" and "javascript-typescript" languages, via the repo's Code security
# settings) does not yet accept "rust" through the default-setup API, even though
# CodeQL's Rust support itself is GA -- hence this explicit advanced-setup workflow,
# scoped to Rust only so it doesn't duplicate what default setup already covers.
name: "CodeQL (Rust)"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 2 * * 6'
permissions:
  contents: read
jobs:
  analyze:
    name: Analyze (rust)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: rust
          build-mode: none
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:rust"
