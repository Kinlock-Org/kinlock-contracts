# DRAFT (ask-first: CI). fmt, clippy -D warnings, test, build. Budget job pending M1-16.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
          targets: wasm32v1-none
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --workspace
      # stellar CLI install step to be pinned when CI is approved (M1-01).
      # - run: stellar contract build
